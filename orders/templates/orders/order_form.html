{% extends "orders/base.html" %}

{% block title %}
Оставить заявку — ServiceFlow
{% endblock %}

{% block content %}

<div class="card">

    <h1>Оставить заявку</h1>

    <p>
        Заполните информацию о технике и выберите удобное время визита.
    </p>

    <form method="post">

        {% csrf_token %}

        {{ form.as_p }}

        <button
            class="button"
            type="submit"
        >
            Отправить заявку
        </button>

    </form>

</div>

{% endblock %}
