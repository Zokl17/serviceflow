{% load static %}

<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        {% block title %}
            ServiceFlow
        {% endblock %}
    </title>

    <link
        rel="stylesheet"
        href="{% static 'orders/style.css' %}"
    >
</head>

<body>

<header class="header">
    <div class="header-inner">

        <a
            class="logo"
            href="{% url 'orders:home' %}"
        >
            ServiceFlow
        </a>

        <nav class="nav">

            <a href="{% url 'orders:home' %}">
                Главная
            </a>

            <a href="{% url 'admin:index' %}">
                Для сотрудников
            </a>

        </nav>

    </div>
</header>

<main class="container">

    {% block content %}
    {% endblock %}

</main>

</body>
</html>
